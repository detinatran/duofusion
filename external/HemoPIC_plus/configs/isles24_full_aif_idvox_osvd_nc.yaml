# The ISLES 2017 configuration full_aif_idvox_osvd_nc on the external ISLES'24 set (1 s from the CTP header).
# HemoPIC+ with a true arterial input: C1 + C5 + C2 + C4 + C3 + C6.
# Automatic AIF (partial-volume corrected by the VOF) drives every ROI and gives
# absolute indicator-dilution priors, so no white-matter calibration and no
# deconvolution map is needed.
name: isles24_full_aif_idvox_osvd_nc
data: {data_root: ../data/ISLES2024_Training, out_root: outputs}
time: {dt_source: header}
model: {flow_per_minute: true, delay_dispersion: true, delay_bounds: [-4, 15]}
robust: {multistart: 4, refit_loss: 0.15}
reference_free: {prior_source: tracer, cbv_texture: tracer_auc, map_bounds: fixed}
arterial: {arterial_input: auto_aif, prior_scale: absolute}
cbv: {cbv_source: id_voxel, cbf_texture: osvd, cbf_texture_clip: false}
